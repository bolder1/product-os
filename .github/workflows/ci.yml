name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # The database is not reachable from CI, and it must not need to be:
      # the client connects on first query, so a build that demands a live
      # database here would be a regression worth failing on.
      - name: Build
        run: pnpm build

  schema:
    name: Schema applies cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ground
          POSTGRES_PASSWORD: ground
          POSTGRES_DB: ground
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ground:ground@localhost:5432/ground

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Apply schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/ground/schema.sql

      # Run it twice: the schema claims to be idempotent, so prove it.
      - name: Apply schema again
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f packages/ground/schema.sql

      - name: Seed
        run: node packages/ground/seed.mjs

      - name: Seed again
        run: node packages/ground/seed.mjs

      - name: Assert seed did not duplicate
        run: |
          COUNT=$(psql "$DATABASE_URL" -tAc "select count(*) from entries")
          echo "entries: $COUNT"
          test "$COUNT" -eq 4
